<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JS-基础语法</title>
</head>
<body>
  

  <script>
    // 1.变量的声明
    var a = 10; //实际开发中不用var，用let或const
    console.log(a); //浏览器打开F12控制台可看(本质输出日志)
    
    a = true;
    console.log(a);

    const AK = 47;
    document.write(AK);//直接在浏览器中显示

    let Hello = 'Hello world';
    alert(Hello);//弹窗显示

    let name = '张三';
    let age = 18;
    console.log('我是'+name+'，我今年'+age+'岁');

  
  </script>
</body>
</html>
