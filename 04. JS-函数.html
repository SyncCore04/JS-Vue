<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JS-函数</title>
</head>
<body>
  

  <script>
    // 函数的定义
    function add(a,b){
      return a+b;
    }
    console.log(add(1,2));
    
    //箭头函数
    let add1 = (a,b) => a+b;
    console.log(add1(3,5));

    //匿名函数
    let add2 = add(100,200);
    console.log(add2);
    
  </script>
</body>
</html>
