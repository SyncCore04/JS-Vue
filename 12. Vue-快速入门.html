<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vue-快速入门</title>
</head>

<body>

  <div id="app">
    <h1>{{ msg }}</h1>
    <p>当前计数: {{ count }}</p>
    <p>姓名: {{ name }}</p>
  </div>

  <script type="module">
    import { createApp } from 'https://unpkg.com/vue@3/dist/vue.esm-browser.js'

    createApp({
      data() {
        return {
          msg: 'hello vue',
          count: 100,
          name: '张三'
        }
      }
    }).mount('#app')

  </script>
</body>

</html>
